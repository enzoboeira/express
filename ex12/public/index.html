<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmes</title>
</head>

<body>

    <h1>Lista de Filmes</h1>

    <nav>
        <a href="index.html">Lista de Filmes</a>
        |
        <a href="cadastro.html">Cadastrar Filme</a>
    </nav>

    <br>

    <label for="busca">Buscar por título:</label>
    <input
        type="text"
        id="busca"
        placeholder="Digite o título"
    >

    <br><br>

    <label for="genero">Gênero:</label>

    <select id="genero">
        <option value="">Todos</option>
    </select>

    <br><br>

    <p id="mensagem"></p>

    <table border="1">

        <thead>
            <tr>
                <th>Título</th>
                <th>Diretor</th>
                <th>Gênero</th>
                <th>Ano</th>
                <th>Nota</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="tabela-filmes"></tbody>

    </table>

    <script>

        let filmes = [];

        const tabela = document.getElementById('tabela-filmes');
        const busca = document.getElementById('busca');
        const genero = document.getElementById('genero');
        const mensagem = document.getElementById('mensagem');

        function mostrarFilmes(lista) {

            tabela.innerHTML = '';

            lista.forEach(filme => {

                const linha = document.createElement('tr');

                let cor;

                if (Number(filme.nota) >= 9) {
                    cor = 'green';
                } else if (Number(filme.nota) >= 7) {
                    cor = 'orange';
                } else {
                    cor = 'red';
                }

                linha.innerHTML = `
                    <td>${filme.titulo}</td>
                    <td>${filme.diretor}</td>
                    <td>${filme.genero}</td>
                    <td>${filme.ano}</td>
                    <td style="color: ${cor}">
                        ${filme.nota}
                    </td>
                    <td>
                        <button onclick="editarNota(${filme.id}, this)">
                            Editar Nota
                        </button>

                        <button onclick="removerFilme(${filme.id}, this)">
                            Remover
                        </button>
                    </td>
                `;

                tabela.appendChild(linha);
            });
        }

        async function carregarFilmes(url = '/api/filmes') {

            try {

                const resposta = await fetch(url);

                const resultado = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(resultado.erro);
                }

                filmes = resultado;

                mostrarFilmes(filmes);

            } catch (erro) {

                mensagem.textContent = erro.message;

            }
        }

        async function carregarGeneros() {

            try {

                const resposta = await fetch('/api/generos');

                const resultado = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(resultado.erro);
                }

                resultado.forEach(item => {

                    const option = document.createElement('option');

                    option.value = item.nome;
                    option.textContent = item.nome;

                    genero.appendChild(option);

                });

            } catch (erro) {

                mensagem.textContent = erro.message;

            }
        }

        async function removerFilme(id, botao) {

            const confirmar = confirm(
                'Tem certeza que deseja remover este filme?'
            );

            if (!confirmar) {
                return;
            }

            try {

                const resposta = await fetch(
                    `/api/filmes/${id}`,
                    {
                        method: 'DELETE'
                    }
                );

                const resultado = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(resultado.erro);
                }

                botao.closest('tr').remove();

                filmes = filmes.filter(filme => filme.id !== id);

                mensagem.textContent =
                    `"${resultado.titulo}" removido com sucesso!`;

            } catch (erro) {

                mensagem.textContent = erro.message;

            }
        }

        function editarNota(id, botao) {

            const linha = botao.closest('tr');
            const celulaNota = linha.children[4];

            const filme = filmes.find(
                filme => filme.id === id
            );

            const notaAtual = filme.nota;

            const input = document.createElement('input');

            input.type = 'number';
            input.min = '0';
            input.max = '10';
            input.step = '0.1';
            input.value = notaAtual;

            celulaNota.innerHTML = '';

            celulaNota.appendChild(input);

            input.focus();

            let salvando = false;

            async function salvarNota() {

                if (salvando) {
                    return;
                }

                const novaNota = Number(input.value);

                if (
                    input.value === '' ||
                    novaNota < 0 ||
                    novaNota > 10
                ) {
                    mensagem.textContent =
                        'A nota deve estar entre 0 e 10';

                    input.focus();

                    return;
                }

                salvando = true;

                try {

                    const resposta = await fetch(
                        `/api/filmes/${id}`,
                        {
                            method: 'PUT',

                            headers: {
                                'Content-Type': 'application/json'
                            },

                            body: JSON.stringify({
                                nota: novaNota
                            })
                        }
                    );

                    const resultado = await resposta.json();

                    if (!resposta.ok) {
                        throw new Error(resultado.erro);
                    }

                    filme.nota = resultado.nota;

                    celulaNota.textContent = resultado.nota;

                    mensagem.textContent =
                        'Nota atualizada com sucesso!';

                } catch (erro) {

                    celulaNota.textContent = notaAtual;

                    mensagem.textContent =
                        erro.message;

                }
            }

            input.addEventListener('keydown', event => {

                if (event.key === 'Enter') {
                    salvarNota();
                }

            });

            input.addEventListener('blur', salvarNota);
        }

        busca.addEventListener('input', () => {

            const texto = busca.value.toLowerCase();

            const filtrados = filmes.filter(filme =>
                filme.titulo
                    .toLowerCase()
                    .includes(texto)
            );

            mostrarFilmes(filtrados);
        });

        genero.addEventListener('change', () => {

            if (genero.value === '') {

                carregarFilmes();

            } else {

                carregarFilmes(
                    `/api/filmes?genero=${encodeURIComponent(genero.value)}`
                );

            }
        });

        carregarFilmes();
        carregarGeneros();

    </script>

</body>

</html>
