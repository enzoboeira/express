<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Filmes</title>
</head>

<body>

    <h1>Cadastro de Filme</h1>

    <nav>
        <a href="cadastro.html">Cadastrar Filme</a>
    </nav>

    <br>

    <form id="formulario">

        <label for="titulo">Título:</label>
        <input type="text" id="titulo" required>

        <br><br>

        <label for="diretor">Diretor:</label>
        <input type="text" id="diretor" required>

        <br><br>

        <label for="ano">Ano:</label>
        <input type="number" id="ano" required>

        <br><br>

        <label for="nota">Nota:</label>
        <input
            type="number"
            id="nota"
            min="0"
            max="10"
            step="0.1"
            required
        >

        <br><br>

        <label for="duracao">Duração:</label>
        <input type="number" id="duracao" required>

        <br><br>

        <label for="genero">Gênero:</label>

        <select id="genero" required>
            <option value="">Selecione um gênero</option>
        </select>

        <br><br>

        <button type="submit">
            Cadastrar
        </button>

    </form>

    <p id="mensagem"></p>

    <script>

        const formulario = document.getElementById('formulario');
        const genero = document.getElementById('genero');
        const mensagem = document.getElementById('mensagem');

        async function carregarGeneros() {

            try {

                const resposta = await fetch('/api/generos');

                const resultado = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(resultado.erro);
                }

                resultado.forEach(item => {

                    const option = document.createElement('option');

                    option.value = item.id;
                    option.textContent = item.nome;

                    genero.appendChild(option);

                });

            } catch (erro) {

                mensagem.textContent = erro.message;

            }

        }

        formulario.addEventListener('submit', async event => {

            event.preventDefault();

            mensagem.textContent = '';

            const dados = {
                titulo: document.getElementById('titulo').value,
                diretor: document.getElementById('diretor').value,
                ano: document.getElementById('ano').value,
                nota: document.getElementById('nota').value,
                duracao: document.getElementById('duracao').value,
                genero_id: genero.value
            };

            try {

                const resposta = await fetch('/api/filmes', {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify(dados)

                });

                const resultado = await resposta.json();

                if (resposta.status === 400) {

                    mensagem.textContent = resultado.erro;

                    return;

                }

                if (resposta.status === 500) {

                    mensagem.textContent = resultado.erro;

                    return;

                }

                if (!resposta.ok) {

                    mensagem.textContent =
                        'Erro ao cadastrar filme';

                    return;

                }

                mensagem.textContent =
                    `"${resultado.titulo}" cadastrado!`;

                formulario.reset();

            } catch (erro) {

                mensagem.textContent =
                    'Erro ao conectar com o servidor';

            }

        });

        carregarGeneros();

    </script>

</body>

</html>
